---
name: Pull Request checks

"on":
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  shell_check:
    name: "Shell: Syntax checks"
    uses: scaleway-terraform-modules/workflows/.github/workflows/shell_check.yaml@2510c7c05af9229bf86d42c8593c3f64a72886d1  # v2.1.16
  go_check:
    name: "Go: Syntax checks"
    runs-on: ubuntu-latest
    env:
      # Build with the function runtime's Go version only, as Scaleway does: never download a newer toolchain.
      GOTOOLCHAIN: local
    steps:
      - id: repo_checkout
        name: "Repository: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: "go_runtime"
        name: "Go: Read the function runtime"
        run: |
          version=$(sed -n 's/^ *runtime *= *"go\([0-9]\)\([0-9]*\)".*/\1.\2/p' functions.tf)
          if [ -z "${version}" ]; then
            echo "::error file=functions.tf::Could not read the Go runtime of the purge function."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - id: "go_setup"
        name: "Go: Setup"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.go_runtime.outputs.version }}
          cache-dependency-path: |
              functions/purge/go.sum
      - id: "go_fmt"
        name: "Go: Check formatting"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            for file in ${unformatted}; do
              echo "::error file=functions/purge/${file}::File is not formatted with gofmt."
            done
            gofmt -d .
            exit 1
          fi
        working-directory: functions/purge
      - id: "go_vet"
        name: "Go: Vet the packages"
        run: go vet ./...
        working-directory: functions/purge
      - id: "go_build"
        name: "Go: Build the packages"
        run: go build ./...
        working-directory: functions/purge
      - id: "go_test"
        name: "Go: Run the tests"
        run: go test ./...
        working-directory: functions/purge
        env:
          # init() requires these variables, in the format the Scaleway SDK expects.
          REGISTRY_ACCESS_KEY: SCW0123456789ABCDEF1
          REGISTRY_NAMESPACE: test
          REGISTRY_PROJECT_ID: 01234567-89ab-cdef-0123-456789abcdef
          REGISTRY_REGION: fr-par
          REGISTRY_SECRET_KEY: 01234567-89ab-cdef-0123-456789abcdef
  tf_module_check:
    name: "Terraform Module: Code checks"
    uses: scaleway-terraform-modules/workflows/.github/workflows/tf_module_check.yaml@2510c7c05af9229bf86d42c8593c3f64a72886d1  # v2.1.16
  yaml_check:
    name: "YAML: Syntax checks"
    uses: scaleway-terraform-modules/workflows/.github/workflows/yaml_check.yaml@2510c7c05af9229bf86d42c8593c3f64a72886d1  # v2.1.16
